# This file contains all custom German text for the dusklight randomizer

# NOTES FOR TRANSLATORS:
# - You should only be translating the "Text" fields for each element in this file.
# - Text being surrounded by braces '{}' means that the text will be colored. If a text field begins with a brace,
#   the entire field must be surrounded with quotation marks.
# - Below each text element, you can specify a given text's gender and/or plurality. If you need additional
#   specifiers for pieces of text, let us know. If no gender is provided, the assumption is no gender. If no
#   plurality is provided, the assumed plurality is singular.
# - Below the Standard, Pretty, and Cryptic types you can optionally specify Template Overrides which can allow
#   for different translations depending on which template the text is being inserted into. See the Cave of Ordeals
#   Great Fairy Reward in the english yaml for an example.

